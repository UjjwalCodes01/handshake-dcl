name: build

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          # The Multiplayer Server runtime declares engines ^22 || ^24, so CI
          # runs the lower bound to prove the floor still works. 22.18+ also has
          # native TypeScript stripping, which the test suite relies on.
          node-version: 22
          cache: npm

      # `npm ci`, never `npm install`: it installs exactly what the lock file
      # says and fails loudly if package.json has drifted. `npm install` would be
      # free to re-resolve the pinned auth-server SDK prerelease onto a different
      # build, and that failure surfaces as missing isServer/Storage rather than
      # as a dependency error.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Pure-logic tests only. Nothing here may depend on build output: bin/ is
      # gitignored, so on a fresh checkout it does not exist yet. A test that
      # asserted otherwise is what broke this workflow's first run.
      - name: Test
        run: npm test

      # Production build plus the hard pre-deploy limits, so a change that would
      # be rejected at publish time fails here instead.
      - name: Preflight
        run: npm run preflight
