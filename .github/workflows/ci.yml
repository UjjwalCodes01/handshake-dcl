name: build

on:
  push:
  pull_request:

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          # The Multiplayer Server's runtime declares engines ^22 || ^24.
          # 22 is the lower supported bound, so CI proves the floor still builds.
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly what the lock
      # file says and fails loudly if package.json and the lock have drifted.
      # `npm install` would be free to re-resolve the pinned auth-server SDK
      # prerelease onto a different build, and the failure would surface as
      # missing isServer/Storage rather than as a dependency error.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
